services:
  dynamodb-init:
    image: alpine:3.20
    command: >
      sh -c "chown -R 1000:1000 /data"
    volumes:
      - dynamodb-data:/data

  dynamodb:
    image: amazon/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb:8000
    ports:
      - "8001:8001"
    depends_on:
      - dynamodb

  localstack:
    image: localstack/localstack:4.8.0
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=0
    ports:
      - "4566:4566"
    volumes:
      - "./docker/localstack/init/ready.d:/etc/localstack/init/ready.d"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - dynamodb
      - localstack
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
    ports:
      - "8080:8080"

volumes:
  dynamodb-data:
    driver: local