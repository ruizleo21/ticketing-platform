spring:
  application:
    name: ticketing-platform
  profiles:
    default: local

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

ticketing:
  reservation-expiration:
    poll-ms: 30000
  sqs:
    poll-ms: 1000
orders:
  reservation-duration-minutes: 10
